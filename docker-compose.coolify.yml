services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wa_crm}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-wa_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wa_crm} -d ${POSTGRES_DB:-wa_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: sh -c "pnpm prisma migrate deploy && pnpm prisma db seed && pnpm exec ts-node -r tsconfig-paths/register src/main.ts"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wa_crm}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-wa_crm}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      FRONTEND_URL: ${FRONTEND_URL:?}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?}
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-demo-org}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v20.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:?}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:?}
      META_CAPI_ENABLED: ${META_CAPI_ENABLED:-false}
      META_DATASET_ID: ${META_DATASET_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_ENCRYPTION_KEY: ${META_CAPI_ENCRYPTION_KEY:-}
      META_CAPI_GRAPH_API_VERSION: ${META_CAPI_GRAPH_API_VERSION:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_CAPI_CURRENCY: ${META_CAPI_CURRENCY:-BRL}
      META_CAPI_SEND_LEAD_EVENTS: ${META_CAPI_SEND_LEAD_EVENTS:-false}
      META_CAPI_SEND_PURCHASE_EVENTS: ${META_CAPI_SEND_PURCHASE_EVENTS:-true}
      FUNNEL_ENABLED: ${FUNNEL_ENABLED:-true}
      FUNNEL_ASSIGN_TO_HUMAN: ${FUNNEL_ASSIGN_TO_HUMAN:-true}
      FUNNEL_MESSAGE_1: ${FUNNEL_MESSAGE_1:-}
      FUNNEL_MESSAGE_2: ${FUNNEL_MESSAGE_2:-}
      FUNNEL_MESSAGE_3: ${FUNNEL_MESSAGE_3:-}
      FUNNEL_MESSAGE_4: ${FUNNEL_MESSAGE_4:-}
      FUNNEL_MESSAGE_5: ${FUNNEL_MESSAGE_5:-}
      FUNNEL_HANDOFF_MESSAGE: ${FUNNEL_HANDOFF_MESSAGE:-}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    expose:
      - "3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_uploads:
